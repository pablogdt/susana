<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Click to Reveal</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }

  #panel {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    padding: 6vw;
    background: #111;
    color: #eee;
    overflow-y: auto;
  }

  #panel h1 {
    max-width: 700px;
    font-size: 1.8rem;
    margin-bottom: 1rem;
  }

  #panel ul {
    max-width: 700px;
    font-size: 1.1rem;
    line-height: 1.9;
    padding-left: 1.4rem;
  }

  #photo {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    background: #000;
    cursor: pointer;
    z-index: 10;
    transition: opacity 0.4s ease;
  }

  #photo.hidden {
    opacity: 0;
    pointer-events: none;
    visibility: hidden;
  }
</style>
</head>
<body>

  <div id="panel">
    <h1>
      Cosas buenas de Susana:
    </h1>
	<ul>
		<li>Guapa</li>
		<li>Inteligente</li>
		<li>Amable</li>
		<li>Leal</li>
		<li>Creativa</li>
		<li>Tienes buena comunicacion</li>
		<li>Escuchas a la gente</li>
		<li>Responsable</li>
		<li>Optimista</li>
		<li>Empatica</li>
		<li>Cariñosa</li>
		<li>Respetuosa</li>
		<li>Aventurera</li>
	</ul>
  </div>

  <img id="photo" src="https://i.ebayimg.com/images/g/HXAAAOxyd8NSa4Bg/s-l1200.jpg" alt="Click to reveal">

  <script>
    const photo = document.getElementById('photo');
    photo.addEventListener('click', () => {
      photo.classList.add('hidden');
    });
  </script>

</body>
</html>
